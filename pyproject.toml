[project]
name = "ipo-enquiry-service"
version = "1.0.0"
description = "FastAPI backend service tracking IPO master data, subscription metrics, Grey Market Premium, scoring, and registrar allotment status."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.12",
    "groq>=0.9.0",
    "pyjwt>=2.8.0",
    "slowapi>=0.1.9",
    "rapidfuzz>=3.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
